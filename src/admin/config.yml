              - { label: "Paragraph 1", name: body1, widget: markdown, buttons: [bold, italic, link], editor_components: [] }
              - { label: "Paragraph 2", name: body2, widget: markdown, buttons: [bold, italic, link], editor_components: [] }
              - { label: "Intro Image", name: image, widget: image, hint: "Shown beside the intro copy." }
