# ═══════════════════════════════════════════════════
#  Sveltia CMS — Kiwanis Club of Winchester
#  Free, Git-based CMS powered by GitHub
# ═══════════════════════════════════════════════════

backend:
  name: github
  repo: darkdefined-spec/kiwanis-winchester
  branch: main
  base_url: https://sveltia-cms-auth.cam767ss.workers.dev

site_url: https://kiwanis-winchester.pages.dev
display_url: https://kiwanis-winchester.pages.dev
logo_url: /assets/uploads/2023/03/logo-1C-e1677883446960.png

# Where to store media uploads.
media_folder: /src/assets/uploads
public_folder: /assets/uploads

# Make uploaded images easier to reuse and safer for page speed.
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048
        svg:
          optimize: true

# Show links out to the rendered site where supported.
show_preview_links: true

collections:

  # ── Global Site Settings ──────────────────────────
  - name: settings
    label: "⚙️ Site Settings"
    icon: settings
    description: "Club-wide contact information, meeting details, and social links used throughout the site."
    delete: false
    editor:
      preview: true
    files:
      - name: general
        label: "General Settings"
        icon: tune
        file: src/_data/site.json
        fields:
          - { label: "Club Name", name: name, widget: string, hint: "Full official club name." }
          - { label: "Short Name", name: shortName, widget: string, hint: "Short version used in compact areas." }
          - { label: "Tagline", name: tagline, widget: string }
          - { label: "Website URL", name: url, widget: string, type: url }
          - { label: "Email Address", name: email, widget: string, type: email }
          - { label: "Facebook URL", name: facebook, widget: string, type: url }
          - { label: "Facebook Handle", name: facebookHandle, widget: string, hint: "Example: @winkiwanis" }
          - label: "Mailing Address"
            name: address
            widget: object
            collapsed: false
            fields:
              - { label: "P.O. Box", name: po_box, widget: string }
              - { label: "City", name: city, widget: string }
              - { label: "State", name: state, widget: string }
              - { label: "ZIP Code", name: zip, widget: string }
          - label: "Weekly Meetings"
            name: meetings
            widget: object
            collapsed: false
            fields:
              - { label: "Day", name: day, widget: string, hint: "Example: Wednesdays" }
              - { label: "Time", name: time, widget: string, hint: "Example: noon" }
              - { label: "Location Name", name: location, widget: string }
              - { label: "Street Address", name: street, widget: string }
          - { label: "Site Description", name: description, widget: text, hint: "Used in search/social metadata and short summaries." }

  # ── Events ────────────────────────────────────────
  - name: editor_content
    label: "🗓️ Live Events, Newsletters & Speakers"
    icon: edit_calendar
    description: "The live data used by the small editor portal and the public Events/Speakers sections."
    delete: false
    editor:
      preview: true
    files:
      - name: editorContent
        label: "Editor Portal Content"
        file: src/_data/editorContent.json
        preview_path: /events/
        fields:
          - label: "Events"
            name: events
            widget: list
            summary: "{{fields.title}} - {{fields.date}}"
            fields:
              - { label: "ID", name: id, widget: string, required: false }
              - { label: "Event Title", name: title, widget: string }
              - { label: "Event Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "MMMM D, YYYY", time_format: false }
              - { label: "Category", name: category, widget: string }
              - { label: "Event Details Line", name: eventMeta, widget: string }
              - label: "Card Header Color"
                name: headerColor
                widget: select
                options:
                  - { label: "Blue", value: blue }
                  - { label: "Gold", value: gold }
                default: blue
              - { label: "Facebook Link", name: facebookUrl, widget: string, type: url, required: false }
              - label: "Photos"
                name: photos
                widget: list
                required: false
                fields:
                  - { label: "Photo", name: src, widget: image }
                  - { label: "Alt Text", name: alt, widget: string }
                  - label: "Photo Crop Focus"
                    name: objectPosition
                    widget: select
                    required: false
                    options:
                      - { label: "Center", value: "center center" }
                      - { label: "Top", value: "top center" }
                      - { label: "Bottom", value: "bottom center" }
                      - { label: "Left", value: "center left" }
                      - { label: "Right", value: "center right" }
          - label: "Newsletters"
            name: newsletters
            widget: list
            summary: "{{fields.title}} - {{fields.date}}"
            fields:
              - { label: "ID", name: id, widget: string, required: false }
              - { label: "Newsletter Title", name: title, widget: string }
              - { label: "Publication Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "MMMM YYYY", time_format: false }
              - { label: "Year", name: year, widget: string, required: false }
              - { label: "PDF File", name: pdfUrl, widget: file, media_folder: /src/assets/uploads/newsletters, public_folder: /assets/uploads/newsletters }
          - label: "Speakers"
            name: speakers
            widget: object
            fields:
              - { label: "Speaker Section Intro", name: intro, widget: markdown, buttons: [bold, italic, link], editor_components: [] }
              - label: "Upcoming Speakers"
                name: upcoming
                widget: list
                required: false
                summary: "{{fields.date}} - {{fields.name}}"
                fields: &speaker_fields
                  - { label: "ID", name: id, widget: string, required: false }
                  - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "MMMM D, YYYY", time_format: false, required: false }
                  - { label: "Name", name: name, widget: string, required: false }
                  - { label: "Organization", name: organization, widget: string, required: false }
                  - { label: "Topic", name: topic, widget: string, required: false }
                  - { label: "Title/Role", name: title, widget: string, required: false }
                  - { label: "Location/Time", name: meta, widget: string, required: false }
                  - { label: "Description", name: description, widget: markdown, buttons: [bold, italic, link], editor_components: [], required: false }
              - label: "Recent & Past Guests"
                name: recent
                widget: list
                required: false
                summary: "{{fields.date}} - {{fields.name}}"
                fields: *speaker_fields

  - name: events
    label: "📸 Legacy Events (not live)"
    label_singular: "Event"
    icon: photo_camera
    description: "Legacy event files kept for reference. The live public page now uses 'Live Events, Newsletters & Speakers'."
    folder: src/content/events
    media_folder: /src/assets/uploads/events
    public_folder: /assets/uploads/events
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    thumbnail: photos.*.src
    preview_path: /events/
    sortable_fields: [date, title]
    view_groups:
      - label: "By year"
        field: date
        pattern: \d{4}
    view_filters:
      - label: "Gold Header"
        field: headerColor
        pattern: gold
      - label: "Blue Header"
        field: headerColor
        pattern: blue
    fields:
      - { label: "Event Title", name: title, widget: string }
      - { label: "Event Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "MMMM D, YYYY", time_format: false }
      - { label: "Category", name: category, widget: string, hint: "Example: Community Event, Service, Fundraiser" }
      - { label: "Event Details Line", name: eventMeta, widget: string, hint: "Example: August 14, 2024 · Jim Barnett Park · Winchester, VA" }
      - label: "Card Header Color"
        name: headerColor
        widget: select
        options:
          - { label: "🔵 Blue", value: blue }
          - { label: "🟡 Gold", value: gold }
        default: blue
      - { label: "Facebook Link", name: facebookUrl, widget: string, type: url, required: false, hint: "Optional link to the Facebook post or album." }
      - label: "Photos"
        name: photos
        widget: list
        required: false
        summary: "{{fields.alt}}"
        fields:
          - { label: "Photo", name: src, widget: image, hint: "Upload or select an event photo. Landscape photos usually work best." }
          - { label: "Alt Text", name: alt, widget: string, hint: "Describe the photo for visitors using screen readers." }
          - label: "Photo Crop Focus"
            name: objectPosition
            widget: select
            required: false
            hint: "Choose where the important part of the photo sits."
            options:
              - { label: "Center", value: "center center" }
              - { label: "Top", value: "top center" }
              - { label: "Bottom", value: "bottom center" }
              - { label: "Left", value: "center left" }
              - { label: "Right", value: "center right" }

  # ── Newsletters ────────────────────────────────────
  - name: newsletters
    label: "📰 Legacy Newsletters (not live)"
    label_singular: "Newsletter"
    icon: article
    description: "Legacy newsletter files kept for reference. The live public page now uses 'Live Events, Newsletters & Speakers'."
    folder: src/content/newsletters
    media_folder: /src/assets/uploads/newsletters
    public_folder: /assets/uploads/newsletters
    create: true
    slug: "{{year}}-{{month}}"
    summary: "{{title}} ({{date}})"
    preview_path: /events/#newsletters
    sortable_fields: [date, title]
    view_groups:
      - label: "By year"
        field: date
        pattern: \d{4}
    fields:
      - { label: "Newsletter Title", name: title, widget: string, hint: "Example: January 2026" }
      - { label: "Publication Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "MMMM YYYY", time_format: false }
      - { label: "PDF File", name: pdfUrl, widget: file, media_folder: /src/assets/uploads/newsletters, public_folder: /assets/uploads/newsletters, hint: "Upload the PDF newsletter file." }

  # ── Pages (Editable Content Blocks) ───────────────
  - name: pages
    label: "📄 Pages"
    icon: web
    description: "Main website page copy and images, grouped by the sections visitors see on each page."
    delete: false
    editor:
      preview: true
    files:

      - name: home
        label: "Home Page"
        icon: home
        file: src/_data/cms/home.json
        preview_path: /
        media_folder: /src/assets/uploads/pages/home
        public_folder: /assets/uploads/pages/home
        thumbnail: hero.image
        fields:
          - label: "Hero Section"
            name: hero
            widget: object
            collapsed: false
            summary: "{{fields.line1}} {{fields.line2}} {{fields.line3}}"
            fields:
              - { label: "Background Image", name: image, widget: image, hint: "First-screen hero image. Recommended: landscape, at least 1800px wide, no text baked into the image." }
              - { label: "Image Alt Text", name: imageAlt, widget: string, hint: "Describe the image for accessibility." }
              - { label: "Eyebrow", name: eyebrow, widget: string }
              - { label: "Headline Line 1", name: line1, widget: string }
              - { label: "Headline Line 2", name: line2, widget: string }
              - { label: "Headline Line 3", name: line3, widget: string }
              - { label: "Highlighted Word", name: highlight, widget: string }
              - { label: "Lead Text", name: lede, widget: markdown, buttons: [bold, italic, link], editor_components: [], hint: "Short intro below the headline. Basic formatting and links are supported." }
              - { label: "Small Note", name: note, widget: string, hint: "Small text below the buttons." }
          - label: "Mission Section"
            name: mission
            widget: object
            collapsed: false
            fields:
              - { label: "Section Title", name: title, widget: string }
              - { label: "Paragraph 1", name: body, widget: markdown, buttons: [bold, italic, link], editor_components: [] }
              - { label: "Paragraph 2", name: body2, widget: markdown, buttons: [bold, italic, link], editor_components: [] }

      - name: about
        label: "About Page"
        icon: groups
        file: src/_data/cms/about.json
        preview_path: /about/
        media_folder: /src/assets/uploads/pages/about
        public_folder: /assets/uploads/pages/about
        thumbnail: hero.image
        fields:
          - label: "Hero Section"
            name: hero
            widget: object
            collapsed: false
            fields:
              - { label: "Background Image", name: image, widget: image, hint: "Top-of-page background image. Recommended: landscape, at least 1800px wide." }
              - label: "Image Crop Focus"
                name: position
                widget: select
                options: &hero_position_options
                  - { label: "Center", value: "center center" }
                  - { label: "Top", value: "top center" }
                  - { label: "Bottom", value: "bottom center" }
                  - { label: "Left", value: "center left" }
                  - { label: "Right", value: "center right" }
                  - { label: "Slightly high", value: "center 35%" }
                  - { label: "Balanced high", value: "center 40%" }
                  - { label: "Balanced", value: "center 42%" }
                  - { label: "Slightly low", value: "center 48%" }
                  - { label: "Higher focus", value: "center 30%" }
                  - { label: "Contact-card focus", value: "center 46%" }
              - { label: "Page Title", name: title, widget: string }
              - { label: "Subtitle", name: subtitle, widget: markdown, buttons: [bold, italic, link], editor_components: [] }
          - label: "Club Overview Section"
            name: overview
            widget: object
            collapsed: false
            fields:
              - { label: "Eyebrow", name: eyebrow, widget: string }
              - { label: "Section Title", name: title, widget: string }
              - { label: "Paragraph 1", name: body1, widget: markdown, buttons: [bold, italic, link], editor_components: [] }
              - { label: "Paragraph 2", name: body2, widget: markdown, buttons: [bold, italic, link], editor_components: [] }
              - { label: "Paragraph 3", name: body3, widget: markdown, buttons: [bold, italic, link], editor_components: [] }
              - { label: "Overview Image", name: image, widget: image, hint: "Image shown beside the overview copy." }
              - { label: "Overview Image Alt Text", name: imageAlt, widget: string }

      - name: whatWeDo
        label: "What We Do Page"
        icon: volunteer_activism
        file: src/_data/cms/whatWeDo.json
        preview_path: /what-we-do/
        media_folder: /src/assets/uploads/pages/what-we-do
        public_folder: /assets/uploads/pages/what-we-do
        thumbnail: hero.image
        fields:
          - label: "Hero Section"
            name: hero
            widget: object
            collapsed: false
            fields:
              - { label: "Background Image", name: image, widget: image, hint: "Top-of-page background image. Recommended: landscape, at least 1800px wide." }
              - { label: "Image Crop Focus", name: position, widget: select, options: *hero_position_options }
              - { label: "Page Title", name: title, widget: string }
