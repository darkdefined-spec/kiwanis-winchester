# ═══════════════════════════════════════════════════
#  Sveltia CMS — Kiwanis Club of Winchester
#  Free, Git-based CMS powered by GitHub
# ═══════════════════════════════════════════════════

backend:
  name: github
  repo: darkdefined-spec/kiwanis-winchester
  branch: main
  base_url: https://sveltia-cms-auth.cam767ss.workers.dev

site_url: https://kiwanis-winchester.pages.dev
display_url: https://kiwanis-winchester.pages.dev
logo_url: /assets/uploads/2023/03/logo-1C-e1677883446960.png

# Where to store media uploads
media_folder: src/assets/uploads
public_folder: /assets/uploads

# Show live preview in the editor
show_preview_links: true

# ─── SITE SETTINGS ────────────────────────────────
collections:

  # ── Global Site Settings ──────────────────────────
  - name: settings
    label: "⚙️ Site Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: general
        label: "General Settings"
        file: src/_data/site.json
        fields:
          - { label: "Club Name", name: name, widget: string }
          - { label: "Short Name", name: shortName, widget: string }
          - { label: "Tagline", name: tagline, widget: string }
          - { label: "Website URL", name: url, widget: string }
          - { label: "Email Address", name: email, widget: string }
          - { label: "Facebook URL", name: facebook, widget: string }
          - { label: "Facebook Handle", name: facebookHandle, widget: string, hint: "e.g. @winkiwanis" }
          - label: "Mailing Address"
            name: address
            widget: object
            fields:
              - { label: "P.O. Box", name: po_box, widget: string }
              - { label: "City", name: city, widget: string }
              - { label: "State", name: state, widget: string }
              - { label: "ZIP Code", name: zip, widget: string }
          - label: "Weekly Meetings"
            name: meetings
            widget: object
            fields:
              - { label: "Day", name: day, widget: string, hint: "e.g. Wednesdays" }
              - { label: "Time", name: time, widget: string, hint: "e.g. noon" }
              - { label: "Location Name", name: location, widget: string }
              - { label: "Street Address", name: street, widget: string }
          - { label: "Description", name: description, widget: text }

  # ── Events ────────────────────────────────────────
  - name: events
    label: "📸 Events"
    label_singular: "Event"
    folder: src/content/events
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    view_filters:
      - label: "Gold Header"
        field: headerColor
        pattern: gold
      - label: "Blue Header"
        field: headerColor
        pattern: blue
    fields:
      - { label: "Event Title", name: title, widget: string }
      - { label: "Event Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "MMMM D, YYYY", time_format: false }
      - { label: "Category", name: category, widget: string, hint: "e.g. Community Event, Service, Fundraiser" }
      - { label: "Event Details Line", name: eventMeta, widget: string, hint: "e.g. August 14, 2024 · Jim Barnett Park · Winchester, VA" }
      - label: "Card Header Color"
        name: headerColor
        widget: select
        options:
          - { label: "🔵 Blue", value: blue }
          - { label: "🟡 Gold", value: gold }
        default: blue
      - { label: "Facebook Link (optional)", name: facebookUrl, widget: string, required: false, hint: "Link to the Facebook post or page" }
      - label: "Photos"
        name: photos
        widget: list
        required: false
        summary: "{{fields.alt}}"
        fields:
          - { label: "Photo", name: src, widget: image }
          - { label: "Alt Text (describe the photo)", name: alt, widget: string }
          - { label: "Object Position (optional)", name: objectPosition, widget: string, required: false, hint: "e.g. top center, center 30%" }

  # ── Newsletters ────────────────────────────────────
  - name: newsletters
    label: "📰 Newsletters"
    label_singular: "Newsletter"
    folder: src/content/newsletters
    create: true
    slug: "{{year}}-{{month}}"
    summary: "{{title}} ({{date}})"
    sortable_fields: [date, title]
    fields:
      - { label: "Newsletter Title", name: title, widget: string, hint: "e.g. January 2026" }
      - { label: "Publication Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "MMMM YYYY", time_format: false }
      - { label: "PDF File", name: pdfUrl, widget: file, media_folder: src/assets/uploads, public_folder: /assets/uploads, hint: "Upload the PDF newsletter file" }

  # ── Pages (Editable Content Blocks) ───────────────
  - name: pages
    label: "📄 Pages"
    delete: false
    editor:
      preview: false
    files:

      - name: home
        label: "Home Page"
        file: src/_data/cms/home.json
        fields:
          - { label: "Hero Image", name: heroImage, widget: image }
          - { label: "Hero Image Alt Text", name: heroImageAlt, widget: string }
          - { label: "Hero Eyebrow", name: heroEyebrow, widget: string }
          - { label: "Hero Headline Line 1", name: heroLine1, widget: string }
          - { label: "Hero Headline Line 2", name: heroLine2, widget: string }
          - { label: "Hero Headline Line 3", name: heroLine3, widget: string }
          - { label: "Hero Highlighted Word", name: heroHighlight, widget: string }
          - { label: "Hero Lede", name: heroLede, widget: text }
          - { label: "Hero Note", name: heroNote, widget: string }
          - { label: "Mission Title", name: missionTitle, widget: string }
          - { label: "Mission Paragraph 1", name: missionBody, widget: text }
          - { label: "Mission Paragraph 2", name: missionBody2, widget: text }

      - name: about
        label: "About Page"
        file: src/_data/cms/about.json
        fields:
          - { label: "Hero Image", name: heroImage, widget: image }
          - { label: "Hero Image Position", name: heroPosition, widget: string, hint: "CSS object-position value, e.g. center 42%" }
          - { label: "Hero Title", name: heroTitle, widget: string }
          - { label: "Hero Subtitle", name: heroSubtitle, widget: text }
          - { label: "Overview Eyebrow", name: overviewEyebrow, widget: string }
          - { label: "Overview Title", name: overviewTitle, widget: string }
          - { label: "Overview Paragraph 1", name: overviewBody1, widget: text }
          - { label: "Overview Paragraph 2", name: overviewBody2, widget: text }
          - { label: "Overview Paragraph 3", name: overviewBody3, widget: text }
          - { label: "Overview Image", name: overviewImage, widget: image }
          - { label: "Overview Image Alt Text", name: overviewImageAlt, widget: string }

      - name: whatWeDo
        label: "What We Do Page"
        file: src/_data/cms/whatWeDo.json
        fields:
          - { label: "Hero Image", name: heroImage, widget: image }
          - { label: "Hero Image Position", name: heroPosition, widget: string }
          - { label: "Hero Title", name: heroTitle, widget: string }
          - { label: "Hero Subtitle", name: heroSubtitle, widget: text }
          - { label: "Intro Eyebrow", name: introEyebrow, widget: string }
          - { label: "Intro Title", name: introTitle, widget: string }
          - { label: "Intro Body", name: introBody, widget: text }
          - { label: "Youth Program Image", name: youthProgramImage, widget: image }
          - { label: "Pancake Spotlight Image", name: pancakeImage, widget: image }

      - name: youthPrograms
        label: "Youth Programs Page"
        file: src/_data/cms/youthPrograms.json
        fields:
          - { label: "Hero Image", name: heroImage, widget: image }
          - { label: "Hero Image Position", name: heroPosition, widget: string }
          - { label: "Hero Title", name: heroTitle, widget: string }
          - { label: "Hero Subtitle", name: heroSubtitle, widget: text }
          - { label: "Intro Eyebrow", name: introEyebrow, widget: string }
          - { label: "Intro Title", name: introTitle, widget: string }
          - { label: "Intro Paragraph 1", name: introBody1, widget: text }
          - { label: "Intro Paragraph 2", name: introBody2, widget: text }
          - { label: "Intro Image", name: introImage, widget: image }
          - { label: "Intro Image Alt Text", name: introImageAlt, widget: string }

      - name: pancake
        label: "Pancake Day Page"
        file: src/_data/cms/pancake.json
        fields:
          - { label: "Hero Image", name: heroImage, widget: image }
          - { label: "Hero Image Alt Text", name: heroImageAlt, widget: string }
          - { label: "Hero Eyebrow", name: heroEyebrow, widget: string }
          - { label: "Hero Title", name: heroTitle, widget: string }
          - { label: "Hero Highlighted Words", name: heroHighlight, widget: string }
          - { label: "Hero Lede", name: heroLede, widget: text }
          - { label: "Hero Note", name: heroNote, widget: text }
          - { label: "Event Status Banner", name: statusBanner, widget: text, hint: "e.g. The April 25, 2026 event has concluded..." }
          - { label: "Event Hours", name: eventHours, widget: string }
          - { label: "Event Location", name: eventLocation, widget: string }
          - { label: "ChildSafe Percentage", name: childsafePercent, widget: string }

      - name: events
        label: "Events & Newsletters Page"
        file: src/_data/cms/events.json
        fields:
          - { label: "Hero Image", name: heroImage, widget: image }
          - { label: "Hero Image Position", name: heroPosition, widget: string }
          - { label: "Hero Title", name: heroTitle, widget: string }
          - { label: "Hero Subtitle", name: heroSubtitle, widget: text }
          - { label: "Events Section Title", name: eventsTitle, widget: string }
          - { label: "Events Section Intro", name: eventsIntro, widget: text }
          - { label: "Newsletters Section Title", name: newslettersTitle, widget: string }
          - { label: "Newsletters Section Intro", name: newslettersIntro, widget: text }

      - name: resources
        label: "Resources Page"
        file: src/_data/cms/resources.json
        fields:
          - { label: "Hero Image", name: heroImage, widget: image }
          - { label: "Hero Image Position", name: heroPosition, widget: string }
          - { label: "Hero Title", name: heroTitle, widget: string }
          - { label: "Hero Subtitle", name: heroSubtitle, widget: text }
          - { label: "Quick Links Title", name: quickLinksTitle, widget: string }
          - { label: "Quick Links Intro", name: quickLinksIntro, widget: text }

      - name: join
        label: "Join Page"
        file: src/_data/cms/join.json
        fields:
          - { label: "Hero Image", name: heroImage, widget: image }
          - { label: "Hero Image Position", name: heroPosition, widget: string }
          - { label: "Hero Title", name: heroTitle, widget: string }
          - { label: "Hero Subtitle", name: heroSubtitle, widget: text }
          - { label: "Why Join Title", name: whyTitle, widget: string }
          - { label: "Why Join Intro", name: whyIntro, widget: text }
          - { label: "Feature Image", name: featureImage, widget: image }
          - { label: "Feature Image Alt Text", name: featureImageAlt, widget: string }
          - { label: "Feature Headline", name: featureHeadline, widget: string }
          - { label: "Feature Body", name: featureBody, widget: text }

      - name: donate
        label: "Donate Page"
        file: src/_data/cms/donate.json
        fields:
          - { label: "Hero Image", name: heroImage, widget: image }
          - { label: "Hero Image Position", name: heroPosition, widget: string }
          - { label: "Hero Title", name: heroTitle, widget: string }
          - { label: "Hero Subtitle", name: heroSubtitle, widget: text }
          - { label: "Main Section Title", name: mainTitle, widget: string }
          - { label: "Main Section Intro", name: mainIntro, widget: text }

      - name: contact
        label: "Contact Page"
        file: src/_data/cms/contact.json
        fields:
          - { label: "Hero Image", name: heroImage, widget: image }
          - { label: "Hero Image Position", name: heroPosition, widget: string }
          - { label: "Hero Title", name: heroTitle, widget: string }
          - { label: "Hero Subtitle", name: heroSubtitle, widget: text }
          - { label: "Form Title", name: formTitle, widget: string }
          - { label: "Form Intro", name: formIntro, widget: text }
