              - { label: "Section Title", name: title, widget: string }
              - { label: "Intro Body", name: body, widget: markdown, buttons: [bold, italic, link], editor_components: [] }
          - label: "Feature Images"
            name: featureImages
            widget: object
            collapsed: false
            fields:
              - { label: "Youth Program Image", name: youthProgram, widget: image, hint: "Used in the youth leadership feature row." }
